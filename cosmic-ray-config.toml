[cosmic-ray]
module-path = "backend/domain/services/registry_admission.py"
test-command = ".venv/Scripts/python.exe -c \"exec(open('tests/test_registry_mutation.py', encoding='utf-8').read())\""
timeout = 30.0
exclude-modules = [
    "backend/main.py",
    "backend/domain/models.py",
    "backend/domain/schemas.py",
    "backend/infrastructure/*"
]

[cosmic-ray.distributor]
name = "local"
